<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecotec Signature</title>
</head>

<body>

    <table cellpadding="0" cellspacing="0" border="0"
        style="width: 100%; max-width: 500px; height: auto; border-radius: 10px; box-sizing: border-box; font-family: Arial, sans-serif;">
        <tr>
            <td colspan="2" style="padding-bottom: 12px;">
                <p style="margin: 0; font-size: 16px;"><strong>Thanks & Best regards,</strong></p>
                <hr style="margin-top: 6px; width: 24px; height: 2px; background-color: #000; border: none;"
                    align="left" />
            </td>
        </tr>
        <tr>
            <td style="width: 15%; vertical-align: top; padding-right: 12px;">
                <a href="https://tecostore.vn/?utm_source=email&utm_medium=signature&utm_campaign=contact_signature"
                    target="_blank" style="display: block; width: 96px;">
                    <img src="./images/icons/logo-TECOTEC-eCom.png" alt="Tecotec eCom Logo"
                        style="display: block; object-fit: fill; width: 100%;" />
                </a>
            </td>

            <td style="width: 85%; padding-left: 12px; border-left: 0.5px solid #146EB4; vertical-align: top;">
                <p style="margin: 0 0 6px; font-size: 14px;"><strong>{{name}}</strong> / {{position}}</p>

                <hr style="height: 1px; background: #146EB4; border: none; margin: 6px 0;" />

                <p style="font-weight: bold; margin: 6px 0 8px; font-size: 14px; color: #FF9900;">TECOTEC E-COMMERCE JSC</p>

                <!-- CONTACT INFO WITH ICONS -->
                <table cellpadding="0" cellspacing="0" border="0">
                    <!-- EMAIL -->
                    <tr>
                        <td style="vertical-align: middle; padding-bottom: 6px; width: 24px;">
                            <img src="./images/icons/icon-email.png" width="20" height="20" style="display: block;" alt="Email" />
                        </td>
                        <td style="vertical-align: middle; padding-bottom: 6px; padding-left: 8px;">
                            <a href="mailto:{{email}}" style="text-decoration: none; color: black; font-size: 14px;">{{email}}</a>
                        </td>
                    </tr>
                    <!-- PHONE -->
                    <tr>
                        <td style="vertical-align: middle; padding-bottom: 6px;">
                            <img src="./images/icons/icon-phone.png" width="20" height="20" style="display: block;" alt="Phone" />
                        </td>
                        <td style="vertical-align: middle; padding-bottom: 6px; padding-left: 8px;">
                            <a href="tel:{{phone}}" style="text-decoration: none; color: black; font-size: 14px;">{{phone}}</a>
                        </td>
                    </tr>
                    <!-- ADDRESS -->
                    <tr>
                        <td style="vertical-align: top; padding-bottom: 6px;">
                            <img src="./images/icons/icon-map.png" width="20" height="20" style="display: block; margin-top: 2px;" alt="Address" />
                        </td>
                        <td style="vertical-align: middle; padding-bottom: 6px; padding-left: 8px;">
                            <span style="font-size: 14px; color: black; line-height: 1.4;">2nd Floor, CT3A Building, Me Tri Thuong,<br>Tu Liem Ward, Ha Noi City, Vietnam</span>
                        </td>
                    </tr>
                    <!-- WEBSITE -->
                    <tr>
                        <td style="vertical-align: middle; padding-bottom: 6px;">
                            <img src="./images/icons/icon-website.png" width="20" height="20" style="display: block;" alt="Website" />
                        </td>
                        <td style="vertical-align: middle; padding-bottom: 6px; padding-left: 8px;">
                            <a href="https://tecostore.vn" target="_blank" style="text-decoration: none; color: black; font-size: 14px;">tecostore.vn</a>
                        </td>
                    </tr>
                </table>

                <!-- SOCIAL ICONS -->
                <p style="margin: 4px 0 0;">
                    <a href="https://www.facebook.com/TecotecGroupJsc" target="_blank" style="display: inline-block; margin-right: 8px;">
                        <img src="./images/icons/Fb.png" width="32" height="32" style="display: block;" alt="Facebook" />
                    </a>
                    <a href="https://www.linkedin.com/company/tecotec-group/" target="_blank" style="display: inline-block; margin-right: 8px;">
                        <img src="./images/icons/icon-linkedin.png" width="32" height="32" style="display: block;" alt="LinkedIn" />
                    </a>
                    <a href="https://www.youtube.com/tecostorevn" target="_blank" style="display: inline-block; margin-right: 8px;">
                        <img src="./images/icons/icon-youtube.png" width="32" height="32" style="display: block;" alt="YouTube" />
                    </a>
                    <a href="https://zalo.me/4313596141196632335" target="_blank" style="display: inline-block;">
                        <img src="./images/icons/icon-zalo.png" width="32" height="32" style="display: block;" alt="Zalo" />
                    </a>
                </p>
            </td>
        </tr>
    </table>

    <!-- section 2 -->
    <table cellpadding="0" cellspacing="0" border="0" width="100%" style="width: 100%; table-layout: fixed; margin-top: 20px;">
        <tr>
            <td>
                <a href="https://tecostore.vn/trimos-2026-seminar?lang=vi&utm_source=email_signature&utm_medium=email&utm_campaign=trimos_seminar_2026&utm_content=banner" target="_blank" style="text-decoration: none;">
                    <img src="./images/banners/banner-trimos-serminar-2026@2x-100.jpg" alt="Trimos Seminar 2026" width="100%" 
                         style="display: block; width: 100%; height: auto; border-radius: 8px; border: 0;">
                </a>
            </td>
        </tr>
    </table>
    
</body>

</html>
